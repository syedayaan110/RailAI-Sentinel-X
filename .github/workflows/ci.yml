name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q RailAI_SentinelX_v5.py experiments archive
      - name: Diagnose environment
        run: python RailAI_SentinelX_v5.py --doctor
      - name: Run built-in self-tests
        run: python RailAI_SentinelX_v5.py --self-test
